<h2>Delete Book</h2>

<p *ngIf="loading">Loading book...</p>
<p *ngIf="errorMessage" style="color: #b00020;">{{ errorMessage }}</p>

<div *ngIf="!loading && book">
  <p>Are you sure you want to delete this book?</p>
  <p><strong>Title:</strong> {{ book.title }}</p>
  <p><strong>Author:</strong> {{ book.author }}</p>
  <img
    [src]="bookService.getCoverUrl(book.cover_image)"
    [alt]="book.title"
    width="60"
    height="80"
    style="object-fit: cover;"
  />

  <div style="margin-top: 12px; display: flex; gap: 8px;">
    <button type="button" (click)="confirmDelete()" [disabled]="deleting">
      {{ deleting ? 'Deleting...' : 'Confirm Delete' }}
    </button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</div>
