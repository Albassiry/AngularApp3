<div class="container">
  <h2>📚 Book Manager</h2>

  <!-- Add / Edit Book Form -->
  <div class="card">
    <h3>{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h3>
    <form (ngSubmit)="saveBook()">
      <div class="form-group">
        <label>Title:</label>
        <input type="text" [(ngModel)]="selectedBook.title" name="title" required class="input-control" />
      </div>
      <div class="form-group">
        <label>Author:</label>
        <input type="text" [(ngModel)]="selectedBook.author" name="author" required class="input-control" />
      </div>
      <div class="form-group">
        <label>Description:</label>
        <textarea [(ngModel)]="selectedBook.description" name="description" class="input-control"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="resetForm()" *ngIf="isEditMode" class="btn btn-secondary">Cancel</button>
    </form>
  </div>

  <!-- Book List Table -->
  <h3>Available Books</h3>
  <table class="book-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td>{{ book.id }}</td>
        <td><strong>{{ book.title }}</strong></td>
        <td>{{ book.author }}</td>
        <td>{{ book.description }}</td>
        <td>
          <button (click)="editBook(book)" class="btn btn-edit">Edit</button>
          <button (click)="deleteBook(book.id)" class="btn btn-danger">Delete</button>
        </td>
      </tr>
      <tr *ngIf="books.length === 0">
        <td colspan="5" style="text-align: center;">No books found.</td>
      </tr>
    </tbody>
  </table>
</div>
