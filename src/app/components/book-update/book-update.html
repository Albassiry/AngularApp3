<h2>Update Book</h2>

<p *ngIf="loading">Loading book...</p>
<p *ngIf="errorMessage" style="color: #b00020;">{{ errorMessage }}</p>

<form *ngIf="!loading && book.id" (ngSubmit)="onUpdate()" style="display: flex; flex-direction: column; gap: 10px; max-width: 440px;">
  <div>
    <label for="title">Title *</label><br />
    <input id="title" name="title" type="text" [(ngModel)]="book.title" required style="width: 100%;" />
  </div>

  <div>
    <label for="author">Author *</label><br />
    <input id="author" name="author" type="text" [(ngModel)]="book.author" required style="width: 100%;" />
  </div>

  <div>
    <label for="description">Description</label><br />
    <textarea id="description" name="description" rows="4" [(ngModel)]="book.description" style="width: 100%;"></textarea>
  </div>

  <div>
    <span>Current Cover:</span><br />
    <img
      [src]="bookService.getCoverUrl(book.cover_image)"
      [alt]="book.title"
      width="60"
      height="80"
      style="object-fit: cover; margin-top: 4px;"
    />
  </div>

  <div>
    <label for="cover">Replace Cover Image (optional)</label><br />
    <input id="cover" type="file" accept="image/*" (change)="onFileChange($event)" />
  </div>

  <div style="display: flex; gap: 8px;">
    <button type="submit" [disabled]="saving">{{ saving ? 'Updating...' : 'Update Book' }}</button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
