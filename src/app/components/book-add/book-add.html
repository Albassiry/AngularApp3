<div class="form-card">
  <h2>Add Book</h2>

  <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

  <form (ngSubmit)="onSubmit()" class="book-form">
    <div class="field">
      <label for="title">Title *</label>
      <input id="title" name="title" type="text" [(ngModel)]="book.title" required />
    </div>

    <div class="field">
      <label for="author">Author *</label>
      <input id="author" name="author" type="text" [(ngModel)]="book.author" required />
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" [(ngModel)]="book.description"></textarea>
    </div>

    <div class="field">
      <label for="cover">Cover Image</label>
      <input id="cover" type="file" accept="image/*" (change)="onFileChange($event)" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Saving...' : 'Save Book' }}
      </button>
      <a routerLink="/list" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
